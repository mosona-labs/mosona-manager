name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  build-and-push-image:
    name: Build and push prebuilt image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mosona-manager
        uses: actions/checkout@v7
        with:
          path: mosona-manager

      - name: Checkout mosona-manager-web
        uses: actions/checkout@v7
        with:
          repository: mosona-labs/mosona-manager-web
          path: mosona-manager-web

      - name: Checkout mosona-manager-pub
        uses: actions/checkout@v7
        with:
          repository: mosona-labs/mosona-manager-pub
          path: mosona-manager-pub

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: mosona-manager/go.mod
          cache-dependency-path: mosona-manager/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push prebuilt image
        working-directory: mosona-manager
        run: |
          ./script/build_prebuilt_image.sh \
            --version "${{ github.event.release.tag_name }}" \
            --push \
            --install

  build-and-upload-agents:
    name: Build agents and upload release assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mosona-manager
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build agent release artifacts
        run: bash script/build.sh --agent --version "${{ github.event.release.tag_name }}"

      - name: Upload build artifacts to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(build/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No files found in build/" >&2
            exit 1
          fi
          gh release upload "${{ github.event.release.tag_name }}" "${files[@]}" --clobber

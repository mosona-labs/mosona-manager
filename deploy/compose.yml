services:
    postgres:
        container_name: mosona-manager-postgres
        image: postgres:18-alpine
        environment:
            POSTGRES_DB: ${PG_DB}
            POSTGRES_USER: ${PG_USER}
            POSTGRES_PASSWORD: ${PG_PASSWORD}
        volumes:
            - pg_data:/var/lib/postgresql
        ulimits:
            nofile:
                soft: 65536
                hard: 65536
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 5s
            timeout: 3s
            retries: 30

    redis:
        container_name: mosona-manager-redis
        image: redis:7-alpine
        command: ["redis-server", "--appendonly", "yes"]
        volumes:
            - redis_data:/data
        ulimits:
            nofile:
                soft: 65536
                hard: 65536
        stop_grace_period: 60s
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 30

    influxdb:
        container_name: mosona-manager-influxdb
        image: influxdb:2.8-alpine
        environment:
            DOCKER_INFLUXDB_INIT_MODE: setup
            DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USER}
            DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD}
            DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
            DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
            DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
            GOGC: "80"
        volumes:
            - influx_data:/var/lib/influxdb2
        ulimits:
            nofile:
                soft: 65536
                hard: 65536
        stop_grace_period: 60s
        healthcheck:
            test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8086/health | grep -q '\"status\":\"pass\"'"]
            interval: 5s
            timeout: 3s
            retries: 60

    app:
        container_name: mosona-manager-app
        image: ghcr.io/mosona-labs/mosona-manager:${APP_VERSION:-latest}
        labels:
            - com.centurylinklabs.watchtower.enable=true
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            influxdb:
                condition: service_healthy
        environment:
            # Internal container bind. Host exposure is restricted by the port mapping below.
            HOST: 0.0.0.0
            PORT: 8080
            SECURE_COOKIES: ${SECURE_COOKIES:-true}

            POSTGRES_HOST: postgres
            POSTGRES_PORT: 5432
            POSTGRES_USER: ${PG_USER}
            POSTGRES_PASS: ${PG_PASSWORD}
            POSTGRES_DB: ${PG_DB}

            REDIS_HOST: redis
            REDIS_PORT: 6379
            REDIS_PASS: ""

            INFLUXDB_URL: http://influxdb:8086
            INFLUXDB_ORG: ${INFLUX_ORG}
            INFLUXDB_BUCKET: ${INFLUX_BUCKET}
            INFLUXDB_TOKEN: ${INFLUX_TOKEN}

            IS_CONTAINER: "1"

            MOSONA_ENCRYPTION_KEY_PATH: /var/lib/mosona-manager/cfg/key

            FRONTEND_DIR: /srv/frontend
        volumes:
            - app_data:/var/lib/mosona-manager
        ports:
            - target: 8080
              published: "${APP_PORT:-8080}"
              host_ip: "${APP_HOST:-127.0.0.1}"
              protocol: tcp
        restart: unless-stopped
        healthcheck:
            # Readiness includes PostgreSQL, Redis, InfluxDB, and app initialization.
            test: ["CMD-SHELL", "/srv/bin/mosona-manager health | grep -q ok"]
            interval: 10s
            timeout: 3s
            retries: 30

    watchtower:
        container_name: mosona-manager-watchtower
        image: containrrr/watchtower:latest
        command:
            - --label-enable
            - --cleanup
            - --interval
            - "${WATCHTOWER_INTERVAL:-300}"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
        restart: unless-stopped

volumes:
    pg_data:
    redis_data:
    influx_data:
    app_data:
